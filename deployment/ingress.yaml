apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: yc
  name: ingress-yc-fps
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/load-balancer-name: lba-eks-test
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: service-yc-fps
              port:
                number: 80
